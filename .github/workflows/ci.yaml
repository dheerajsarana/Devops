name: Continuous Integration For the Project
on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "project 3/api"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "project 3/api/package-lock.json"

      - name: Installing dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint
  build-deploy:
    needs: lint
    runs-on: ubuntu-latest
    environment: DEV
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: "project 3/api"

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/devops:${{ github.sha }} .

      - name: Push docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops:${{github.sha }}

      - name: Deploying to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker pull ghcr.io/${{ github.repository_owner }}/devops:${{ github.sha }}

            docker run -d --name node-app -p 3000:3000 ghcr.io/${{ github.repository_owner }}/devops:${{github.sha}}
